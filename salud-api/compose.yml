name: salud-api-local
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: salud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${DB_MIGRATION_PASSWORD:?Definir DB_MIGRATION_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/001-roles.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salud"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
