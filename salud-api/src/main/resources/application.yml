spring:
  application:
    name: salud-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/salud}
    username: ${DB_USERNAME:salud_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: salud
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:55432/salud}
    user: ${DB_MIGRATION_USERNAME:salud_migrator}
    password: ${DB_MIGRATION_PASSWORD:}
    default-schema: salud
    schemas: salud
    clean-disabled: true
    validate-on-migrate: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 20m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
app:
  mfa:
    required-staff: ${MFA_REQUIRED_STAFF:true}
  encryption-key: ${APP_ENCRYPTION_KEY}
  portal-url: ${PORTAL_URL:http://127.0.0.1:4387}
  delivery:
    url: ${DELIVERY_URL:}
    token: ${DELIVERY_TOKEN:}
    simulated: false
  worker:
    enabled: ${WORKER_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
